<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DecaChat - Group Room</title>
  
  <!-- FontAwesome Icons CDN (कोई आइकन डाउनलोड करने की जरूरत नहीं) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    /* Animated Gradient Background */
    body {
      background: radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                  #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Glassmorphism Home Card */
    .card {
      background: rgba(23, 32, 54, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 40px 32px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-align: center;
      width: 90%;
      max-width: 420px;
      position: relative;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 30px;
      margin-bottom: 16px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .card h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 24px;
    }

    /* Pulsing Glowing Icon Button */
    .icon-container {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .icon-glow-ring {
      position: absolute;
      top: -6px; left: -6px; right: -6px; bottom: -6px;
      border-radius: 50%;
      background: linear-gradient(45deg, #0ea5e9, #6366f1);
      filter: blur(12px);
      opacity: 0.6;
      animation: pulse 3s infinite ease-in-out;
      z-index: 0;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.85; }
    }

    .icon-btn {
      position: relative;
      z-index: 1;
      width: 96px;
      height: 96px;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-radius: 50%;
      color: #38bdf8;
      font-size: 38px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .icon-btn:hover {
      transform: scale(1.08) translateY(-3px);
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 15px 30px rgba(14, 165, 233, 0.35);
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }

    /* Input Field Styling */
    .input-wrap {
      position: relative;
      margin: 18px 0 12px;
    }

    .input-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 16px;
    }

    .input-box {
      width: 100%;
      padding: 13px 14px 13px 44px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0b1120;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-box:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.3);
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(14, 165, 233, 0.45);
    }

    /* Chat Room Screen */
    #chat-screen {
      display: none;
      width: 95%;
      max-width: 950px;
      height: 88vh;
      background: rgba(23, 32, 54, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
      flex-direction: column;
    }

    .chat-header {
      background: rgba(15, 23, 42, 0.7);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .header-info h3 {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-info span {
      font-size: 12px;
      color: #94a3b8;
    }

    .exit-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .exit-btn:hover {
      background: #ef4444;
      color: #fff;
    }

    .chat-main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(11, 17, 32, 0.5);
    }

    /* Sidebar Members */
    .sidebar {
      width: 220px;
      background: rgba(15, 23, 42, 0.6);
      border-left: 1px solid rgba(255, 255, 255, 0.06);
      padding: 18px;
      overflow-y: auto;
    }

    .sidebar h4 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #94a3b8;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar ul { list-style: none; }

    .sidebar li {
      font-size: 14px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      margin-bottom: 8px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    /* Chat Bubbles */
    .msg {
      max-width: 65%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .msg.other {
      background: #1e293b;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .msg.mine {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      color: #fff;
    }

    .msg .sender-name {
      font-size: 11px;
      font-weight: 700;
      color: #93c5fd;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .chat-footer {
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.7);
      display: flex;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .chat-footer input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0b1120;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    .chat-footer input:focus {
      border-color: #38bdf8;
    }

    .chat-footer button {
      padding: 12px 22px;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
    }
  </style>
</head>
<body>

  <!-- Home / Join Room Screen -->
  <div class="card" id="home-screen">
    <div class="badge">
      <i class="fa-solid fa-users"></i> Max 10 Members
    </div>
    <h1>Group Chat</h1>
    
    <div class="icon-container">
      <div class="icon-glow-ring"></div>
      <button class="icon-btn" onclick="openRoomInput()" title="Join Group Room">
        <i class="fa-solid fa-comments"></i>
      </button>
    </div>

    <p class="subtitle">आइकन पर क्लिक करें और रूम कोड डालकर चैट शुरू करें</p>

    <div id="room-input-box" style="display: none; margin-top: 10px;">
      <div class="input-wrap">
        <i class="fa-solid fa-key"></i>
        <input type="text" id="roomCodeInput" class="input-box" placeholder="रूम कोड दर्ज करें (उदा: 7788)" />
      </div>
      <button class="btn" onclick="joinRoom()">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Join Room
      </button>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen">
    <div class="chat-header">
      <div class="header-info">
        <h3 id="displayRoomCode"><i class="fa-solid fa-hashtag" style="color: #38bdf8;"></i> Room: ----</h3>
        <span><i class="fa-solid fa-shield-halved"></i> प्राइवेट 10-पर्सन एंड-टू-एंड चैनल</span>
      </div>
      <button class="exit-btn" onclick="leaveRoom()">
        <i class="fa-solid fa-right-from-bracket"></i> Exit
      </button>
    </div>
    
    <div class="chat-main">
      <div class="chat-messages" id="messagesList"></div>
      
      <!-- Side Bar: कितने लोग Join हैं -->
      <div class="sidebar">
        <h4><i class="fa-solid fa-user-group"></i> Active (<span id="userCount">0</span>/10)</h4>
        <ul id="userList"></ul>
      </div>
    </div>

    <div class="chat-footer">
      <input type="text" id="msgInput" placeholder="अपना मैसेज लिखें..." onkeypress="handleKeyPress(event)" />
      <button onclick="sendMessage()">
        <span>Send</span>
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // आपकी Firebase कॉन्फ़िगरेशन
    const firebaseConfig = {
      apiKey: "AIzaSyBtGn2nJxkSYmRWXZPx84rYuznDko7NtGE",
      authDomain: "decachat-804fb.firebaseapp.com",
      projectId: "decachat-804fb",
      storageBucket: "decachat-804fb.firebasestorage.app",
      messagingSenderId: "261229134887",
      appId: "1:261229134887:web:49d0c6d4f3a04e1dcbfa02",
      measurementId: "G-61JW1LQ6G5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let userName = localStorage.getItem("chat_username") || "";
    let currentRoom = "";
    let userRef = null;

    function openRoomInput() {
      if (!userName) {
        userName = prompt("कृपया अपना नाम दर्ज करें:");
        if (!userName || userName.trim() === "") {
          alert("नाम दर्ज करना जरूरी है!");
          userName = "";
          return;
        }
        localStorage.setItem("chat_username", userName.trim());
      }
      document.getElementById("room-input-box").style.display = "block";
      document.getElementById("roomCodeInput").focus();
    }

    function joinRoom() {
      const room = document.getElementById("roomCodeInput").value.trim();
      if (!room) {
        alert("कृपया एक रूम कोड दर्ज करें!");
        return;
      }
      currentRoom = room;

      const roomUsersRef = db.ref(`rooms/${currentRoom}/users`);

      // 10 यूजर की लिमिट चेक
      roomUsersRef.once("value", (snapshot) => {
        const users = snapshot.val() || {};
        const count = Object.keys(users).length;

        if (count >= 10) {
          alert("माफ़ करें! इस रूम में पहले से 10 लोग पूरे हो चुके हैं।");
          return;
        }

        userRef = roomUsersRef.push();
        userRef.set({ name: userName });
        userRef.onDisconnect().remove();

        document.getElementById("home-screen").style.display = "none";
        document.getElementById("chat-screen").style.display = "flex";
        document.getElementById("displayRoomCode").innerHTML = `<i class="fa-solid fa-hashtag" style="color: #38bdf8;"></i> Room: ${currentRoom}`;

        listenMessages();
        listenUsers();
      });
    }

    function listenUsers() {
      db.ref(`rooms/${currentRoom}/users`).on("value", (snapshot) => {
        const users = snapshot.val() || {};
        const userList = document.getElementById("userList");
        userList.innerHTML = "";
        
        const count = Object.keys(users).length;
        document.getElementById("userCount").innerText = count;

        for (let key in users) {
          const li = document.createElement("li");
          li.innerHTML = `<span class="online-dot"></span> <i class="fa-regular fa-user" style="font-size:12px; color:#94a3b8;"></i> ${users[key].name}`;
          userList.appendChild(li);
        }
      });
    }

    function listenMessages() {
      const messagesList = document.getElementById("messagesList");
      messagesList.innerHTML = "";

      db.ref(`rooms/${currentRoom}/messages`).on("child_added", (snapshot) => {
        const data = snapshot.val();
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("msg");
        msgDiv.classList.add(data.sender === userName ? "mine" : "other");

        msgDiv.innerHTML = `
          <div class="sender-name">
            <i class="fa-regular fa-circle-user"></i> ${data.sender}
          </div>
          <div>${data.text}</div>
        `;
        messagesList.appendChild(msgDiv);
        messagesList.scrollTop = messagesList.scrollHeight;
      });
    }

    function sendMessage() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text) return;

      db.ref(`rooms/${currentRoom}/messages`).push({
        sender: userName,
        text: text,
        time: Date.now()
      });

      input.value = "";
    }

    function handleKeyPress(e) {
      if (e.key === "Enter") sendMessage();
    }

    function leaveRoom() {
      if (userRef) userRef.remove();
      location.reload();
    }
  </script>
</body>
</html>
